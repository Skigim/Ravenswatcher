name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      # The packaged app must start and spawn its packaged reader. With no
      # game running, the reader's exit status 3 (no game) is the proof.
      # APPDATA points at a temp folder so the app's userData stays isolated.
      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $smoke | Out-Null
          $env:APPDATA = $smoke
          $env:LOCALAPPDATA = $smoke
          $exe = (Resolve-Path ../build/release/win-unpacked/Ravenswatcher.exe).Path
          $out = Join-Path $smoke 'out.log'
          $err = Join-Path $smoke 'err.log'
          $p = Start-Process $exe -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 20
          taskkill /F /T /PID $p.Id | Out-Null
          Start-Sleep -Seconds 1
          Get-Content $out, $err -ErrorAction SilentlyContinue
          $found = Select-String -Path $out, $err -SimpleMatch '[sidecar] exited (code=3' -Quiet
          if (-not $found) { exit 1 }
          exit 0
  test-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's
      # sandbox needs; the Electron-driven suites crash at launch without this.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Ubuntu's default, pinned so test-linux-backend always exercises the
      # refused attach to a non-descendant (how the game relates to this app).
      - run: sudo sysctl -w kernel.yama.ptrace_scope=1
      - run: xvfb-run -a npm test
      - run: npm run dist
      # The packaged app must start and spawn its packaged reader. With no
      # game running, the reader's exit status 3 (no game) is the proof.
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          set -u
          tarball=$(ls ../build/release/*-linux-x64.tar.gz)
          mkdir -p ../build/smoke && tar -xzf "$tarball" -C ../build/smoke
          exe=$(find ../build/smoke -maxdepth 2 -type f -name ravenswatcher | head -1)
          timeout -k 5 20 xvfb-run -a "$exe" > ../build/smoke.log 2>&1 || true
          cat ../build/smoke.log
          grep -q '\[sidecar\] exited (code=3' ../build/smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: ravenswatcher-linux-${{ github.sha }}
          path: build/release/*-linux-x64.tar.gz
          if-no-files-found: error
