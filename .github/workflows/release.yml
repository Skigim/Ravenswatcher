# Manually build a pushed version tag and publish its Windows zip here.
# Tags alone publish nothing. Version and dated changelog section must match.

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0. Must already be pushed."
        required: true
        type: string

env:
  TAG: ${{ inputs.tag }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      # Build the tagged commit, not whatever branch the run was started from.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run dist

      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${TAG}" ] || { echo "tag ${TAG} but package.json is $v"; exit 1; }

      # The version's section of the changelog, so the notes are written once,
      # in the repo, and reviewed before the push.
      - name: Read the release notes from the changelog
        shell: bash
        run: |
          v="${TAG#v}"
          if grep -q "^## $v — unreleased" ../release/CHANGELOG.md; then
            echo "release/CHANGELOG.md still lists $v as unreleased; date the heading"; exit 1
          fi
          awk -v v="$v" '/^## /{ if (on) exit; on = ($2 == v); next } on' ../release/CHANGELOG.md > ../notes.md
          grep -q '[^[:space:]]' ../notes.md || { echo "no section for $v in release/CHANGELOG.md"; exit 1; }
          cat ../notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" ../build/release/*.zip \
            --repo "${{ github.repository }}" --verify-tag --title "${TAG}" --notes-file ../notes.md
